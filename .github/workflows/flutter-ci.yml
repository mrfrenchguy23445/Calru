name: Flutter CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: sh tool/bootstrap_platforms.sh
      - run: dart format .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
