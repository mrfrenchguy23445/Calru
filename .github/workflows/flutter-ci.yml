name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calru-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform projects
        run: sh tool/bootstrap_platforms.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format .
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test --reporter expanded

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android APK
            os: ubuntu-latest
            command: flutter build apk --release
            artifact: build/app/outputs/flutter-apk/app-release.apk
          - target: Linux desktop
            os: ubuntu-latest
            command: flutter build linux --release
            artifact: build/linux/x64/release/bundle
          - target: Windows desktop
            os: windows-latest
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - target: macOS desktop
            os: macos-latest
            command: flutter build macos --release
            artifact: build/macos/Build/Products/Release
          - target: iOS device
            os: macos-latest
            command: flutter build ios --release --no-codesign
            artifact: build/ios/iphoneos/Runner.app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Generate native platform projects
        shell: bash
        run: sh tool/bootstrap_platforms.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Build release target
        run: ${{ matrix.command }}
      - name: Upload release build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: calru-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
