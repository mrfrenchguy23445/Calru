name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform projects
        shell: bash
        run: sh tool/bootstrap_platforms.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format .
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test

  build:
    needs: validate
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android APK
            os: ubuntu-latest
            command: flutter build apk --release
            package: android
          - target: Linux x64
            os: ubuntu-latest
            command: flutter build linux --release
            package: linux
          - target: Windows x64
            os: windows-latest
            command: flutter build windows --release
            package: windows
          - target: macOS
            os: macos-latest
            command: flutter build macos --release
            package: macos
          - target: iOS unsigned
            os: macos-latest
            command: flutter build ios --release --no-codesign
            package: ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux' && matrix.package == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Generate platform projects
        shell: bash
        run: sh tool/bootstrap_platforms.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Build
        run: ${{ matrix.command }}
      - name: Package Android
        if: matrix.package == 'android'
        shell: bash
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/calru-android.apk
      - name: Package Linux
        if: matrix.package == 'linux'
        shell: bash
        run: |
          mkdir -p release-assets
          tar -czf release-assets/calru-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: Package Windows
        if: matrix.package == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath release-assets/calru-windows-x64.zip
      - name: Package macOS
        if: matrix.package == 'macos'
        shell: bash
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/calru.app release-assets/calru-macos.zip
      - name: Package iOS (unsigned)
        if: matrix.package == 'ios'
        shell: bash
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app release-assets/calru-ios-unsigned.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.package }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
